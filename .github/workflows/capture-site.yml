name: Capture current site

# One-off: screenshots www.kaosarntooting.co.uk and records the fonts and
# colours it uses, then commits them to reference/ for the redesign.
on:
  push:
    paths: ['.github/workflows/capture-site.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Capture
        run: |
          mkdir -p reference
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const URL = 'https://www.kaosarntooting.co.uk/';
          const browser = await chromium.launch();
          const report = {};
          for (const width of [390, 1280]) {
            const page = await browser.newPage({ viewport: { width, height: width < 700 ? 844 : 900 }, deviceScaleFactor: 1 });
            await page.goto(URL, { waitUntil: 'networkidle', timeout: 90000 });
            const h = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < h; y += 500) { await page.evaluate((y) => scrollTo(0, y), y); await page.waitForTimeout(250); }
            await page.evaluate(() => scrollTo(0, 0));
            await page.waitForTimeout(2500);
            await page.screenshot({ path: `reference/site-${width}-top.jpg`, type: 'jpeg', quality: 80 });
            await page.screenshot({ path: `reference/site-${width}-full.jpg`, type: 'jpeg', quality: 70, fullPage: true });
            if (width === 1280) {
              report.styles = await page.evaluate(() => {
                const seen = new Map();
                for (const el of document.querySelectorAll('body *')) {
                  if (!el.childNodes.length || ![...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())) continue;
                  const cs = getComputedStyle(el);
                  const key = [cs.fontFamily, cs.fontSize, cs.fontWeight, cs.fontStyle, cs.color, cs.letterSpacing, cs.textTransform].join(' | ');
                  const sample = el.textContent.trim().slice(0, 60);
                  if (!seen.has(key)) seen.set(key, { tag: el.tagName, sample, count: 0 });
                  seen.get(key).count++;
                }
                return [...seen.entries()].map(([k, v]) => ({ style: k, ...v })).sort((a, b) => b.count - a.count);
              });
              report.backgrounds = await page.evaluate(() => {
                const out = new Map();
                for (const el of document.querySelectorAll('body *')) {
                  const r = el.getBoundingClientRect();
                  if (r.width < 200 || r.height < 60) continue;
                  const bg = getComputedStyle(el).backgroundColor;
                  if (bg && bg !== 'rgba(0, 0, 0, 0)') out.set(bg, (out.get(bg) || 0) + Math.round(r.width * r.height / 1000));
                }
                return [...out.entries()].sort((a, b) => b[1] - a[1]);
              });
              report.fonts = await page.evaluate(() => [...document.fonts].filter((f) => f.status === 'loaded').map((f) => `${f.family} ${f.weight} ${f.style}`));
              report.images = await page.evaluate(() => [...document.images].map((i) => ({ src: i.currentSrc || i.src, alt: i.alt, w: i.naturalWidth, h: i.naturalHeight })));
              report.text = await page.evaluate(() => document.body.innerText);
              report.title = await page.title();
            }
            await page.close();
          }
          await writeFile('reference/site.json', JSON.stringify(report, null, 2));
          await browser.close();
          JS
          node capture.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference
          git commit -m "Capture the current site for reference" || echo "Nothing new to commit"
          git push
