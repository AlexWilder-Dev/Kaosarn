name: Fetch photos

# One-off: downloads the restaurant's photos on GitHub's runner and commits
# the originals, the WebP files and the manifest to the branch.
on:
  push:
    paths: ['.github/workflows/fetch-photos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run photos
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/original public/photos src/data/photo-manifest.json
          git commit -m "Add the restaurant's photos" || echo "Nothing new to commit"
          git push
